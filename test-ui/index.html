<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>smaregi-mcp テストUI</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>smaregi-mcp テストUI</h1>
  <div id="status" class="status-badge status-connecting">
    <span class="dot"></span>
    <span id="statusText">接続中...</span>
  </div>
  <div class="header-note">
    全て実API呼び出し &middot; fujioka fork
  </div>
</header>

<div class="body-wrap">
  <div class="top-area">
    <!-- Left: Chat -->
    <div class="chat-panel">
      <div class="messages" id="messages">
        <div class="msg msg-bot">smaregi-mcp テストUIへようこそ。
クイックプロンプトか自由入力で試してください。
全ての応答は実際のスマレジAPIから取得します。</div>
      </div>
    </div>

    <!-- Right: Raw response -->
    <div class="raw-panel">
      <div class="raw-header">
        <span class="label">APIレスポンス</span>
        <span id="rawMeta"></span>
      </div>
      <div class="raw-body" id="rawBody">(チャットでコマンドを送信すると、ここに生のAPIレスポンスが表示されます)</div>
    </div>
  </div>

  <!-- Bottom: Log -->
  <div class="log-bar">
    <div class="log-header">ツール実行ログ</div>
    <div class="log-body" id="logBody"></div>
  </div>
</div>

<!-- Quick prompts -->
<div class="quick-prompts">
  <button class="qbtn" data-prompt="店舗一覧を取得して">店舗一覧</button>
  <button class="qbtn" data-prompt="商品一覧を見せて">商品一覧</button>
  <button class="qbtn" data-prompt="今日の取引を見たい">今日の取引</button>
  <button class="qbtn" data-prompt="今月の売上を見せて">今月の売上</button>
  <button class="qbtn" data-prompt="カテゴリ一覧を見せて">カテゴリ</button>
  <button class="qbtn" data-prompt="スタッフ一覧を見せて">スタッフ</button>
  <button class="qbtn" data-prompt="在庫を確認して">在庫</button>
  <button class="qbtn" data-prompt="会員一覧を見せて">会員</button>
  <button class="qbtn" data-prompt="認証状態を確認して">認証状態</button>
  <button class="qbtn" data-prompt="利用可能なAPIパスを表示して">APIパス一覧</button>
</div>

<!-- Input -->
<div class="input-area">
  <input id="input" type="text" placeholder="例: 店舗一覧を取得して / 今日の売上を見たい">
  <button id="btn">送信</button>
</div>

<script src="/app.js"></script>
</body>
</html>
